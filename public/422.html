<!doctype html>

<html lang="en">

  <head>

    <title>There was an error (422 Unprocessable Entity)</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: #f3f4f6;
        color: #1f2937;
        display: grid;
        font-family: "Lato", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        font-style: normal;
        font-weight: 400;
        line-height: 1.5;
        min-height: 100vh;
        place-items: center;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      main {
        display: grid;
        gap: 0;
        padding: 1.5rem;
        place-items: center;
        width: 100%;
      }

      .card {
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        max-width: 28rem;
        padding: 2.5rem 2rem;
        text-align: center;
        width: 100%;
      }

      .brand-logo {
        display: block;
        height: auto;
        margin: 0 auto 1.5rem;
        width: 180px;
      }

      h1 {
        color: #1f2937;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .message {
        color: #6b7280;
        font-size: 0.9375rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }

      .btn {
        background: #063b8d;
        border: 1px solid #063b8d;
        border-radius: 0.5rem;
        color: #ffffff;
        display: inline-block;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        margin: 0 0.25rem 0.5rem;
        padding: 0.625rem 1.25rem;
        text-decoration: none;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .btn:hover {
        background: #ffffff;
        color: #063b8d;
      }

      footer {
        color: #9ca3af;
        font-size: 0.75rem;
        margin-top: 1.5rem;
        text-align: center;
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/422.html -->

    <main>
      <div class="card">
        <img src="/logo-name-color-blue.png" alt="A Window Between Worlds" class="brand-logo">
        <h1>There was an error</h1>

        <p class="message">The request was rejected. Please go back and try again. If you're the application owner check the logs for more information.</p>
        <a href="javascript:history.back()" class="btn">Go Back and Try Again</a>
        <a href="/" class="btn">Go to Homepage</a>
      </div>
      <footer>
        &copy; 2026 A Window Between Worlds &reg; &trade;
      </footer>
    </main>

  </body>

</html>
