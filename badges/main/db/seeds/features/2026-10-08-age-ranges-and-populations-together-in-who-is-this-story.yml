name: "Age ranges and populations together in \"Who is this story about?\""
area: stories
display_status: user_facing
released_on: 2026-10-08
pr_number: 2627
summary: >-
  When sharing a story idea or tagging a story, "Who is this story about?" now
  offers age ranges (Children, Teens, Adults, Elders) on the first row and
  populations (Families, Community, Self, Colleagues) on the second, as one set
  of tags.
pro_tips:
  - "Star any one of them — an age range or a population — as the story's primary."
action_path: "/story_ideas/new"
