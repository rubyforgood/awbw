name: "Filter the forms list by form role"
area: reporting
display_status: admin_facing
released_on: 2026-10-25
action_path: /forms
pr_number: 2850
summary: >-
  The forms list has a form role picker next to the New form button, so you can
  show just registration, scholarship, survey, or any other kind of form.
pro_tips:
  - "General includes older forms that were never given a role."
  - "The filter stays in the page's web address, so a refresh or a shared link keeps it."
  - "Add ?name= and part of a form's name to the end of the web address to narrow the list by name."
