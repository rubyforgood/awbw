name: "Fewer duplicate people from registrations and forms"
area: people
display_status: admin_facing
released_on: 2026-10-09
pr_number: 2632
action_path: "/people/dedupe_index"
summary: >-
  Registrations and public forms now recognize a returning person when their
  email is their secondary or login email, or when a hyphenated name is typed
  with a different dash. Two people can no longer share the same first name,
  last name, and email.
pro_tips:
  - "Double-clicking Register no longer creates a second person; the extra click shows \"You are already registered.\""
  - "Use Dedupe on the People page to combine records that already exist twice."
