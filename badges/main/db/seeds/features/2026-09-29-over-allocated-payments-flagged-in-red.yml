name: "Over-allocated payments flagged in red"
area: payments
display_status: admin_facing
released_on: 2026-09-29
summary: >-
  When more is allocated to a registration or CE record than it costs, the
  amount-due totals turn red and read "$X over" instead of showing "Paid", and a
  warning icon flags it in the registrations index and event registrants roster —
  so an overpayment that needs reconciling is easy to spot.
action_path: "/event_registrations"
