name: "Memberships renew automatically"
area: payments
display_status: admin_facing
released_on: 2026-10-30
pr_number: 2920
action_path: "/memberships"
summary: >-
  Each night the portal issues the renewal invoice a set number of days before a
  term ends (30 by default, in App settings), if the current invoice is paid.
  Issuing it extends the term a year.
pro_tips:
  - "An unpaid renewal still shows Active, with a \"Balance due\" badge."
  - "If the current invoice was never paid, no renewal is issued and the membership ends on its end date."
