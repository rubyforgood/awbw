name: "See where a registrant transferred to"
area: registration
display_status: admin_facing
released_on: 2026-11-27
action_path: "/transfer_guide"
summary: >-
  Hover a "Transferred out" badge on the registrants list to see which training
  the person moved to, with its abbreviation. A "Manage transfer" button sits
  above the badge: blue once the destination is recorded, amber until then.
