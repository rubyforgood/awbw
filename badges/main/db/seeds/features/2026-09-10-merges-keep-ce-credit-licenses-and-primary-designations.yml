name: "Merges keep CE credit, licenses, and primary designations intact"
area: people
display_status: admin_facing
released_on: 2026-09-10
pr_number: 2530
action_path: "/people/dedupe_index"
summary: >-
  Merging two duplicate people — or two duplicate registrations for one event —
  now consolidates their CE registrations and professional licenses instead of
  stopping with an error, and settles the kept person on a single primary sector
  and age range.
description: >-
  When both records hold the same license (or a placeholder with no number on
  file), the merge combines them into one and moves the CE history onto the
  surviving license, so nothing is lost and the merge no longer fails on a
  license that has CE credit attached. Two CE registrations for the same
  enrollment collapse into one, keeping both records' payments. The kept person
  ends up with one primary sector and one primary age range — theirs if they had
  one, otherwise the duplicate's — while every other sector and age range is
  kept as an additional tag. The deleted person's profile photo moves over when
  the kept person has none.
pro_tips:
  - "If merging two paid CE records onto one enrollment leaves more paid than it costs, the CE registration shows a \"Check payments\" flag so you can reconcile the payments — the cost is never inflated to hide it."
  - "The preview tells you what will move before you merge. It still can't be undone."
