name: "School-district chart reads the registration's affiliation"
area: reporting
display_status: admin_facing
released_on: 2026-09-14
pr_number: 2534
action_path: "/events"
summary: >-
  The registrant "School districts" breakdown now comes from the organization
  each person registered under (their affiliation) instead of their home
  address — a school district describes where someone facilitates, not where
  they live. The address "District" field is now labeled "School district".
