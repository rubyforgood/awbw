name: "Decide how your name appears on what you share"
area: people
display_status: user_facing
released_on: 2026-08-20
pr_number: 2093
summary: >-
  One profile setting decides how you're credited on every story, workshop,
  variation, and resource you share: full name, first name and last initial, and
  more, or anonymously as "AWBW Facilitator."
pro_tips:
  - "Change it under \"Profile display preferences\" when you edit your profile. Every credit updates together."
