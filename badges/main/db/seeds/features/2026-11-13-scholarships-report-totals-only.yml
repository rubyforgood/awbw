name: "Show only totals on the scholarships report"
area: scholarships
display_status: admin_facing
released_on: 2026-11-13
pr_number: 2992
action_path: "/events/scholarships"
summary: >-
  A "Funded / unfunded | Totals only" toggle in the scholarships report's table
  headers hides the funded and unfunded columns so you see just the totals.
  Flipping it in one table flips both.
pro_tips:
  - "Total columns are tinted so they stand apart from the funded and unfunded split."
