name: "New job agreement"
area: people
display_status: admin_facing
released_on: 2026-08-22
action_path: "/forms"
pr_number: 2304
summary: >-
  A facilitator moving to a new organization signs the new job agreement at
  its public form link. Linking the new organization ends their affiliations
  at other organizations and starts fresh job and Facilitator affiliations on
  the submission date.
pro_tips:
  - Anything the agreement ended is flagged on the submission's processing
    panel ("Ended by this agreement") with an edit link, so a wrongly-ended
    affiliation is easy to correct.
  - Filter the form submissions list by scenario, organization linking, or
    account status to work the queue end to end.
