name: "Certificate of completion settings"
area: events
display_status: admin_facing
released_on: 2026-10-08
summary: >-
  A new admin page to connect certificate artwork: a full-bleed frame for the
  facilitator-training, on-demand, CE, and other-events certificates, plus the
  facilitator-training and CE signature strips. Upload each as a Resource, then
  connect it here.
action_path: "/admin/resource_roles"
pro_tips:
  - "Leave a slot empty to use the built-in design for that certificate type."
  - "The facilitator-training signature shows on live training certificates only — never on-demand or other events."
