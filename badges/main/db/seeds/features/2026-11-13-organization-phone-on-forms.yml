name: "Organization phone on forms"
area: people
display_status: admin_facing
released_on: 2026-11-13
pr_number: 2997
action_path: "/forms"
summary: >-
  Forms can now ask for the organization's phone. It's saved on the organization as a
  work phone when the form is submitted or linked, and a new number becomes its primary.
pro_tips:
  - "New forms include Organization Phone automatically. Add it to an existing form by hand."
  - "The registration import reads an OrganizationPhone column too."
