name: "FileMaker codes on imported addresses and phones"
area: people
display_status: admin_facing
released_on: 2026-10-25
pr_number: 2860
summary: >-
  Addresses and phone numbers brought in from FileMaker — for people and
  organizations — now carry the FileMaker record they came from, so each one
  can be traced back to the archive.
pro_tips:
  - "An address or phone's page in the FileMaker archive links back to the person or organization holding it."
  - "When FileMaker has an address or number the record already had, the existing one takes the FileMaker code rather than getting a copy."
  - "Merging duplicate addresses or phones keeps every FileMaker code they carried."
