name: "Lock members' logins in bulk"
area: payments
display_status: admin_facing
released_on: 2026-11-06
pr_number: 2956
action_path: "/memberships"
summary: >-
  From the memberships list's bulk actions, lock the portal login of every
  checked person. Each row also has its own lock toggle. Locking blocks sign-in
  but doesn't change the membership.
pro_tips:
  - "A locked login never unlocks on its own."
  - "A locked person can still pay through an invoice's shareable payment link."
