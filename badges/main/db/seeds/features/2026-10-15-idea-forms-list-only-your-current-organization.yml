name: "Idea forms list only your current organization"
area: content
display_status: admin_facing
released_on: 2026-10-15
pr_number: 2693
summary: >-
  When you submit a workshop variation idea or a story idea, the organization
  choices now include only the organizations you're currently active with,
  not every organization you've ever been part of.
pro_tips:
  - "If you're active with just one organization, it's filled in for you and the dropdown is hidden."
  - "Don't see the right organization? Contact AWBW to update your affiliation."
