  description: >-
    Reach it from the Dedupe link on the People page. It clusters likely
    duplicates and flags why each was grouped — same name, a nickname or
    legal-name variant of it, a shared email, the same FileMaker code, or the
    same date of birth. The preview shows a side-by-side of both records with the
    kept person's key fields editable, plus a summary of every associated record
    (affiliations, event registrations, memberships, scholarships, authored
    content, tags, and more) that moves to the kept person. The merge reassigns
    all of them and deletes the duplicate. It can't be undone. Admin-only.
  pro_tips:
    - "Edit the kept person's fields right in the preview before you merge."
    - "Use Swap if you picked the wrong record to keep."
    - "If both people have a login, the preview says so: after the merge both logins sign in to the kept person, and no login is lost."

