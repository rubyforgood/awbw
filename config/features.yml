# Seed for the "Features & tips" page (/features).
#
# This file is the STARTER content only. The live page is database-backed and
# edited in-app by super-admins (rich descriptions with screenshots, external
# doc links, etc.). An admin clicks "Sync latest updates" on /features to pull any
# entries here that aren't in the database yet — it NEVER overwrites an existing
# feature (matched by name), so admin edits are safe. See CLAUDE.md
# "Features & tips page" and FeatureCatalog#import!.
#
# WHEN YOU SHIP A USER-FACING FEATURE, add an entry here:
#   name:           Short, sentence-case name.
#   area:           One of Feature::AREA_KEYS (events, registration, scholarships,
#                   payments, people, content, stories, communications, reporting).
#   display_status: Who it's for AND who may see it on the page:
#                   public_facing | user_facing | admin_facing
#                   (admin_facing is visible to super-admins only).
#   summary:        One or two plain-language sentences (shown on the card).
#   released_on:    Ship date (YYYY-MM-DD).
#   action_path:    In-app path for the "Check out this feature" link (e.g. /events).
#                   Use "/registration/sample" for ticket/callout features — it
#                   resolves to a real registrant's ticket, else a sample ticket.
#   pr_number:      GitHub PR number it shipped in (adds a "View the pull request" link).
#   pro_tips:       Optional list of short, practical tips (0–2 is plenty).
#   description:    Optional longer write-up (plain text or HTML). Admins usually
#                   expand this in the WYSIWYG with screenshots.
#   external_url:   Optional link to a full process doc (e.g. a Google/Word doc).

# ── 2026-09 ─────────────────────────────────────────────────────────────────

- name: "Clearer bulk payment confirmation email"
  area: payments
  display_status: user_facing
  released_on: 2026-09-01
  summary: >-
    The bulk-payment confirmation email now reads "Payment submission received" so
    people paying by check aren't misled into thinking the payment already cleared.
    It also adds a "View invoice" button next to "View payment" that links straight
    to their itemized invoice.
  pr_number: 2486

- name: "Compact training registrations on the subscriptions page"
  area: communications
  display_status: admin_facing
  released_on: 2026-09-01
  summary: >-
    On the topic subscriptions page, a person's facilitator trainings now show as
    compact attendance-status pills on one line instead of a stacked list. Hover a
    pill to see the training's name and date.
  action_path: /topic_subscriptions
  pr_number: 2482

# ── 2026-08 ─────────────────────────────────────────────────────────────────

- name: "No-show trainings no longer count toward program status"
  area: people
  display_status: admin_facing
  released_on: 2026-08-31
  summary: >-
    No-show, cancelled, and transferred-out trainings no longer count as
    facilitation: not toward New / Ongoing / Reinstated, not toward
    "Facilitators since", and not toward Active / Formerly active. On the org
    edit page they now show a red attendance chip instead.
  action_path: /organizations
  pr_number: 2464

- name: "Repeat registration submissions no longer create duplicates"
  area: registration
  display_status: user_facing
  released_on: 2026-08-31
  summary: >-
    If someone submits an event registration more than once — two submissions in a
    row, or coming back to register again later — they now stay a single person with
    one registration for that event, instead of appearing as duplicates on your
    roster. Every submission is still saved, so no answers are lost.
  pr_number: 2465
  pro_tips:
    - "The registrant's confirmation page shows their most recent submission."
    - "Each submission is kept in full, so you can see what changed between them."

- name: "Set who a workshop log is credited to"
  area: content
  display_status: admin_facing
  released_on: 2026-08-31
  summary: >-
    Admins can now credit a workshop log to a specific person on its edit page,
    separate from the account that entered it. Editing a log also no longer
    changes who is recorded as having submitted it.
  action_path: /workshop_logs
  pr_number: 2460

- name: "Pick a layout template for each event page"
  area: events
  display_status: user_facing
  released_on: 2026-08-31
  summary: >-
    Each event can now choose a display template for its public page — from the
    plain layout you have today to bold branded ones with a navy hero, a cream
    editorial style, or a sticky details sidebar. Your header image, details, and
    description stay the same; only the framing changes.
  action_path: /events
  pr_number: 2442
  pro_tips:
    - "Set it under Event show page → Layout template on the event form."
    - "Use Preview all templates to compare them side by side before choosing."
    - "Every template still honors your show/hide toggles for the title, date, cost, and more."

- name: "Schedule site banners with start and end dates"
  area: communications
  display_status: admin_facing
  released_on: 2026-08-30
  summary: >-
    Banners can now carry an optional "show from" and "show until" date, so an
    announcement can be set up ahead of time and disappear on its own instead of
    having to be published and unpublished by hand.
  pro_tips:
    - "Leave both dates blank to behave exactly as before — the banner shows whenever it is published."
    - "Set only a start date to schedule ahead, or only an end date to auto-expire."

- name: "Scholarship recipients get an agreement confirmation email"
  area: scholarships
  display_status: public_facing
  released_on: 2026-08-30
  action_path: /registration/sample
  summary: >-
    When a recipient accepts their scholarship agreement, they now get a confirmation
