  released_on: 2026-08-29
  action_path: "/forms"
  pr_number: 2350
  summary: >-
    Public forms can now be submitted anonymously. Make the name and email
    questions optional (uncheck "Required") and a respondent who skips them
    submits without identifying themselves — shown as "Anonymous" in the
    submissions index.
  pro_tips:
    - There's no separate setting — anonymity follows the required status of the
      name and email questions. Required means everyone identifies; optional lets
      them skip.
    - A respondent who does fill name and email is still matched to a person as
      before; only a skipped identity is anonymous.
    - Agreement forms (registration, new job, reinstatement) are the exception —
      they always require name and email, because every submission is processed
      against a person.
    - Anonymous responses send the team the usual FYI email but no confirmation
      goes back (there's no email to send it to).

- name: "See what a form submission changed"
  area: registration
  display_status: admin_facing
  released_on: 2026-08-29
  pr_number: 2303
  summary: >-
    A "What this submission changed" page shows admins what a form submission
    overwrote on existing records — profile, address, phone, org — plus an org it
    created through the linking flow. A counted blue bar links to it wherever the
    submission appears.
  pro_tips:
    - "Reach it from the submission page, the registrant's submissions, the linked-organizations editor, the registration edit page, and the registrant's own public confirmation."
    - "Counts edits to records that already existed, plus an org created through linking; a submitter's own brand-new records and tags aren't counted."
    - "Each row links to that record's edit page at the changed field."
    - "The admin submission view now links straight to the registrant's own public version of the form (opens in a new tab)."

- name: "Form builder and public form redesigned"
  area: registration
  display_status: user_facing
  released_on: 2026-08-29
  pr_number: 2413
  summary: >-
    The form builder pages lose the heavy purple banner for the same light
    identity band the rest of the portal uses, and the public form and its
    preview now share one header so what you preview is what registrants see.
  pro_tips:
    - "The preview page and the live public form use the same header now, so the preview is a true likeness."

- name: "Data health checks for admins"
  area: reporting
  display_status: admin_facing
  released_on: 2026-08-21
  action_path: "/admin/data_health"
  summary: >-
    A page listing consistency checks that span every record rather than one page
    at a time — each shows a count, the rows it found, and a button to fix them
    where a correct fix exists.
  pro_tips:
    - "Checks with nothing to report stay quiet, so an empty page is the healthy state."
    - >-
      Not every check can be fixed automatically. Ones marked "Review by hand"
      report only, because the right answer is a judgement call rather than a rule.

- name: "Dynamic search on the admin visits page"
  area: reporting
  display_status: admin_facing
  released_on: 2026-08-30
  action_path: "/admin/activities/visits"
  summary: >-
    The admin Visits page now filters as you type — no more full-page reloads — and
    adds IP address and user agent search plus sortable columns.
  pro_tips:
    - "Search by IP address (exact) or user agent (partial) to trace a single device or session."
    - "Click the Started, User, Activities, or Duration column headers to sort."

- name: "Sort and resource-title search on the admin activity feed"
  area: reporting
  display_status: admin_facing
  released_on: 2026-08-30
  action_path: "/admin/activities/events"
  summary: >-
    The admin activity feed gains a Resource title search (find activity by the name
    of the workshop, resource, or record it touched) and sortable Time, Activity, and
    User columns.
  pro_tips:
    - "Resource title searches the name captured on each activity, which is more precise than the broader Details search."

- name: "Readable browser and device in the admin visits table"
  area: reporting
  display_status: admin_facing
  released_on: 2026-08-30
  action_path: "/admin/activities/visits"
  summary: >-
    The visits log now shows a plain-English browser and device summary
    (e.g. "Desktop · Windows 10 · Firefox 5.0") instead of the raw user agent string.
  pro_tips:
    - "Hover the browser column to see the full raw user agent when you need the exact string."

- name: "Clearer status chips on the affiliation editor"
  area: people
  display_status: user_facing
  released_on: 2026-08-30
  pr_number: 2438
  summary: >-
    The affiliation editor shows a status chip under the dates — "Upcoming" below
    the start date for one that hasn't begun, "Inactive" below the end date for one
    that has ended, and nothing for a currently active affiliation. A row no longer
    shows both labels at once.
  pro_tips:
    - "No chip means the affiliation is active right now — a chip only appears for a future start or a past end."
    - "The chips look and behave the same on the person editor, the organization editor, and the standalone affiliation edit page."

- name: "Search and filter the bulk payments dashboards"
  area: payments
  display_status: admin_facing
  released_on: 2026-08-30
  pr_number: 2006
  summary: >-
    Both bulk payment pages now share one filter bar — search across payer name,
    email, organization, and submitted details, plus payment method and status
    filters. Each payer row on an event's dashboard also shows chips for attendees
    who aren't registered or aren't paid in full.
  pro_tips:
    - "The search box finds payers even when they have no Portal account — it looks at everything they typed on the form and the submission's saved details, not just a linked person."
    - "The red \"not registered\" and amber \"unpaid\" chips sit next to the payment status, so you can spot who still needs follow-up before the money is settled."

- name: "Refreshed event cards"
  area: events
  display_status: public_facing
  released_on: 2026-08-30
  action_path: "/events"
  pr_number: 2443
  summary: >-
    Event cards on the home page and the Events page now lead with a large banner
    image, with the location, date, and time laid out below and the Register button
    beside them. Events without their own image show a branded placeholder.
  pro_tips:
    - "Add a primary image when editing an event and it shows on the card — otherwise a default AWBW placeholder is used."
    - "The home page highlights events two-per-row with larger images, while the full Events page shows a denser three-per-row grid."

- name: "Jump straight to a person's edit page"
  area: people
  display_status: admin_facing
  released_on: 2026-08-31
  pr_number: 2453
  summary: >-
    Clicking a person across the admin pages now opens their edit page directly,
    instead of landing on the read-only profile first. Person names appear as a
    compact "Edit" card and always show the full name, even when the person's own
    display preference is shorter.
  pro_tips:
    - "This covers people cards on registrants, notifications, membership invoices, professional licenses, monthly reports, users, and the affiliation and staff editors."
    - "The full name shows here for admins even if the person set their public credit to a first name or initials — that preference still governs public-facing pages, not the admin editor."

- name: "Attach several forms to a ticket callout"
  area: registration
  display_status: admin_facing
  released_on: 2026-08-30
  summary: >-
    A registration-ticket callout can now deliver more than one form. The callout
    editor's single "Linked form" picker is now "Linked forms" — add as many as you
    like, each with its own optional display date so it drips open on that date.
  pro_tips:
    - "Leave a form's display date blank to open it as soon as the callout itself opens; set one to hold the form back until later. The callout's own display date always wins, so no form opens before its callout does."
    - "Each linked form gets its own completion column on the registrants roster, under the Ticket forms switch."

- name: "Feedback surveys on your registration ticket"
  area: registration
  display_status: user_facing
  released_on: 2026-08-30
  summary: >-
    Training feedback surveys now live on your registration ticket. A "Feedback
    surveys" callout opens the Day 1 / Day 2 evaluations and an overall post-event
    survey, each on its own date; submit one and it collapses to a "Completed"
    toggle you can reopen to edit.
  pro_tips:
    - "Scholarship recipients get their recipients survey on their own scholarship page, once their agreement is signed and their tasks are complete."
    - "Reopen any completed survey to review or edit your answers."

- name: "Scholarship recipient survey gates the certificate"
  area: registration
  display_status: admin_facing
  released_on: 2026-08-30
  summary: >-
    Scholarship recipients get their own survey on their scholarship page, and it
    gates their certificate. Until they submit it the recipient sits at "Survey
    pending" on the registrants roster and can't be marked complete.
  pro_tips:
    - "The survey shows on the recipient's scholarship page once they've signed their agreement and their scholarship tasks are marked complete (plus any display date on the scholarship callout's linked form)."
    - "Setup: run `bin/rails data:seed_survey_forms` to create the survey forms, then open the callout editor on the scholarship callout and Restore default so it links the recipients survey."
    - "To record a survey received another way (e.g. on paper), use the Survey received toggle on the registration edit page — it satisfies the gate without a digital submission."

- name: "Staff notified when a post-event survey is submitted"
  area: registration
  display_status: admin_facing
  released_on: 2026-08-30
  summary: >-
    Every post-event survey submission — Day 1, Day 2, or the recipients survey —
    sends a FYI email with the submitter's answers to the default notification
    address, so staff see feedback without opening the registrant's record.
  pro_tips:
    - "The email lists the submitted answers and links the submitter and event."
    - "It sends on each submission; the subject says \"New\" for a first submission and \"Updated\" when the registrant edits their answers."

- name: "Content-sharing questions set your profile preferences"
  area: registration
  display_status: user_facing
  released_on: 2026-08-30
  summary: >-
    The anonymity and display-name questions now write straight through to your
    profile — answering them on a registration form or a post-event survey updates
    how your contributed content is credited (anonymous, or shown under your chosen
    name format).
  pro_tips:
    - "Change your answers any time by reopening the survey, or from your profile directly."
    - "Admins: on a registration form the change shows up on the submission's \"What this submission changed\" page, like any other profile edit."

- name: "Reconciled-away registrations hidden on profiles, flagged for staff"
  area: people
  display_status: admin_facing
  released_on: 2026-08-31
  summary: >-
    A person's profile no longer shows event cards for registrations that were
    reconciled away — cancelled, no-show, or transferred out. Admins and the
    person themselves still see those cards, tinted blue and marked with the
    attendance status, so the history isn't lost.
  pro_tips:
    - "Everyone else sees only active registrations (registered, attended, incomplete)."

- name: "Merge duplicate registrations"
  area: registration
  display_status: admin_facing
  released_on: 2026-08-31
  action_path: "/event_registrations/dedupe_index"
  summary: >-
    A new "Dedupe" tool on the Event registrations page finds and merges duplicate
    registrations — the same person signed up for one event under two different
    people records. It suggests likely matches, previews exactly what moves, and
    combines the two registrations into one.
  pro_tips:
    - "Duplicates are suggested when two registrations for the same event have registrants with a matching name, email, or FileMaker code."
    - "Merging combines the registrations only — the two people stay separate, so merge them in the People deduper too if they're the same person."
    - "The preview shows every attendance, payment, and organization link that moves to the kept registration before you confirm, and blocks the merge if anything can't be moved safely."

- name: "Nest organizations under a parent"
  area: people
  display_status: admin_facing
  released_on: 2026-08-31
  pr_number: 2473
  summary: >-
    An organization can now sit under a parent “roof” organization — so a program
    that used to be split into separate records (e.g. one for Adult Windows and
    one for Children's Windows) can be grouped under one org.
  pro_tips:
    - "Set the parent from the “Parent organization” picker on the org edit page."
    - "The profile shows a “Part of …” link up to the parent and a “Nested organizations” list down to the children."
    - "Deleting a parent org un-nests its children rather than deleting them."

- name: "Averages and totals on form results"
  area: reporting
  display_status: admin_facing
  released_on: 2026-09-01
  pr_number: 2477
  summary: >-
    The form results page now summarizes number questions with their average,
    total, and number of responses, instead of listing every raw figure — so a
    count question like "individuals served" reads as a running total.
  pro_tips:
    - "This covers any question set to a number input type. Text and choice questions are unaffected."

- name: "Mark subscriptions and staff taggings"
  area: communications
  display_status: admin_facing
  released_on: 2026-09-01
  summary: >-
    Tag people, then check them off the list. Each topic and staff tag names its
    own mark ("Confirmed", "Completed", …), and you can tick each row right on the
    taggings or subscriptions index. Both also gain a sortable mark column, an
    All / Yes / No filter, and an autosaving notes box.
  pro_tips:
    - "Set the word on the topic (Manage topics) or the staff tag (Manage staff tags); it defaults to \"Marked\" until you name it."
    - "Flip the mark slider or filter to Yes/No to work through the list."
    - "The notes box saves when you click away, and shows up in that row's comment log."

- name: "Hide toggles on the activities timeline"
  area: reporting
  display_status: admin_facing
  released_on: 2026-09-01
  summary: >-
    The admin Activities page has three switches to hide whole categories of
    noise — account/login churn, read-and-browse interactions, and
    communications — so you can pare a timeline down to record changelogs.
  pro_tips:
    - "A person's History link opens with account and interaction events already hidden, so you land on their changelogs and communications; flip the switches back on to see everything."
    - "\"Account\" covers logins, password resets, email changes, admin grants, and User-record edits; \"Interactions\" covers views, prints, downloads, and searches."
  action_path: "/admin/activities/events"

- name: "Activities timeline reads like a feed"
  area: reporting
  display_status: admin_facing
  released_on: 2026-09-01
  summary: >-
    The admin Activities page is redesigned to read at a glance: each event leads
    with the record it touched, a plain-language action chip (New, Edit, Auto…),
    and its details — field changes, a comment's text, or a communication's
    subject and body — stacked in one column.
  pro_tips:
    - "Click anywhere in a row's Activity cell to open the record it's about; a comment opens what it was left on (the affiliation, scholarship, or profile), and a communication opens the message."
    - "Click a Visit ID to see everything that happened in that visit."
    - "Long comment and email bodies are trimmed — hover to read the full text."
  action_path: "/admin/activities/events"
