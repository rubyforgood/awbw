- name: "Copy a form"
  area: content
  display_status: admin_facing
  released_on: 2026-08-18
  action_path: "/forms"
  pr_number: 2258
  summary: >-
    Duplicate any form with one click. The copy ("COPY of ...") carries over
    every field and answer option so you can tweak a near-identical form instead
    of rebuilding it from scratch.
  pro_tips:
    - The copy starts unpublished with no public link — set those on the new form
      when you're ready.
    - Event links and past submissions stay with the original; the copy is a fresh
      form.

- name: "Transfer a registration to another event"
  area: registration
  display_status: admin_facing
  released_on: 2026-08-18
  action_path: "/transfer_guide"
  pr_number: 2044
  summary: >-
    Move a registrant from one event to another of the same format without losing
    whether they attended. The transfer is tracked as a link between the two
    registrations, so the roster and dashboard show who transferred in or out and
    admins can edit or undo the move.
  pro_tips:
    - An incoming registration keeps its payment, scholarship, and CE on the
      original registration — the edit form shows a read-only summary that links
      back to the source instead of its own billing cards.
    - Reporting totals stay on the original event; the new event still counts the
      person in headcount and attendance but leaves them out of its financial
      totals.
    - Transferring someone a second time collapses the chain — the new
      registration points straight at the original source and the middle stop is
      removed.

- name: "Filter index pages by author or person name"
  area: content
  display_status: user_facing
  released_on: 2026-08-22
  pr_number: 2311
  summary: >-
    Type a name into the filter box to narrow an index by who authored or is
    named on each record. Added to Stories, Workshop variations, Workshop ideas,
    Membership invoices, and Payments.
  pro_tips:
    - Partial names work — "jane" matches "Jane Doe" — and it honors each author's
      credit preference, so it never surfaces a name shown as anonymous.
    - Workshop ideas now list the credited author (per that person's display
      preference) rather than whoever entered the idea.

- name: "Tag people with internal staff tags"
  area: people
  display_status: admin_facing
  released_on: 2026-08-22
  action_path: "/staff_tags"
  pr_number: 2313
  summary: >-
    Mark people with internal, admin-only staff tags for talent pipelines,
    rosters, and outreach — potential future trainers, sector leader candidates,
    cohort or roundtable prospects. Tag someone on their edit page, then filter
    the people list by a tag to pull the roster.
  pro_tips:
    - Staff tags are internal only — public visitors never see them. Admins get a
      Staff tags section on the Tags and Taggings pages where each tag links to its
      people roster.
    - Manage the list of tags at /staff_tags. Unpublish a tag to retire it from the
      pickers while keeping its history; you can only delete a tag that isn't in
      use.
    - Each tag records which admin applied it, and when.

- name: "Browse and search all form answers"
  area: reporting
  display_status: admin_facing
  released_on: 2026-08-22
  action_path: "/form_answers"
  summary: >-
