# Database configuration
# To override any settings, set the DATABASE_URL environment variable.
# Example: DATABASE_URL=trilogy://user:password@host:port/database?encoding=utf8mb4&collation=utf8mb4_unicode_ci
#
# The encoding and collation settings ensure consistent UTF-8 handling across
# Mac and Linux environments, preventing schema.rb merge conflicts.
#
# WORKSPACE_PORT gives each parallel workspace its own database. Under Conductor
# it is derived from CONDUCTOR_PORT by the bin/conductor-* scripts.
<% workspace_port = ENV["WORKSPACE_PORT"].presence %>

base: &base
  adapter: trilogy
  encoding: utf8mb4              # <-- forces UTF-8 everywhere
  collation: utf8mb4_unicode_ci  # <-- portable across MySQL 5.7/8.0 and MariaDB
  pool: <%= ENV.fetch("DB_POOL", 10) %>
  user: root
  password:
  host: 127.0.0.1
  variables:
    # Make sure the session uses utf8mb4 too:
    collation_connection: utf8mb4_unicode_ci
    sql_mode: STRICT_ALL_TABLES
  url: <%= ENV.fetch("DATABASE_URL", "trilogy://root@localhost") %>

development:
  primary: &primary_development
    <<: *base
    database: awbw_development<%= "_#{workspace_port}" if workspace_port %>
#  queue:
#    <<: *primary_development
#    database: awbw_development_queue
#    migrations_paths: db/queue_migrate
#  cache:
#    <<: *primary_development
#    database: awbw_development_cache
#    migrations_paths: db/cache_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *base
  # TEST_ENV_NUMBER is set by parallel_tests to give each parallel process its
  # own database (blank for the first process, "2", "3", ... for the rest).
  database: awbw_test<%= "_#{workspace_port}" if workspace_port %><%= ENV['TEST_ENV_NUMBER'] %>

staging:
  primary: &primary_staging
    <<: *base
  cache:
    <<: *primary_staging
    database: awbw_staging_cache
    migrations_paths: db/cache_migrate
    url: <%= ENV.fetch("CACHE_DATABASE_URL", nil) %>
  queue:
    <<: *primary_staging
    database: awbw_staging_queue
    migrations_paths: db/queue_migrate
    url: <%= ENV.fetch("QUEUE_DATABASE_URL", nil) %>

production:
  primary: &primary_production
    <<: *base
  cache:
    <<: *primary_production
    database: awbw_production_cache
    migrations_paths: db/cache_migrate
    url: <%= ENV.fetch("CACHE_DATABASE_URL", nil) %>
  queue:
    <<: *primary_production
    database: awbw_production_queue
    migrations_paths: db/queue_migrate
    url: <%= ENV.fetch("QUEUE_DATABASE_URL", nil) %>


