# Database configuration
# Uses DATABASE_URL environment variable by default
# Example: DATABASE_URL=trilogy://user:password@host:port/database?encoding=utf8mb4&collation=utf8mb4_unicode_ci

default: &default
  adapter: trilogy
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: 5
  variables:
    collation_connection: utf8mb4_unicode_ci
    sql_mode: STRICT_ALL_TABLES

development:
  <<: *default
  user: root
  password:
  host: 127.0.0.1
  database: awbw_development

test:
  <<: *default
  user: root
  password:
  host: 127.0.0.1
  database: awbw_test

production:
  <<: *default
  user: root
  password:
  host: 127.0.0.1
