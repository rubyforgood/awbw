default: &default
  database: cache
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    max_age: <%= 60.days.to_i %>
    max_size: <%= 3.gigabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

staging:
  <<: *default
  store_options:
    max_size: <%= 256.megabytes %>

production:
  <<: *default
