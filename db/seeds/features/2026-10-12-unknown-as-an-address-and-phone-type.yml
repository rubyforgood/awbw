name: "Unknown as an address and phone type"
area: people
display_status: user_facing
released_on: 2026-10-12
pr_number: 2630
summary: >-
  An address or phone number saved without a type now reads as Unknown instead of
  showing nothing, and Unknown is one of the choices in the type menu.
pro_tips:
  - "Pick Work or Personal to replace Unknown whenever you know which it is."
  - "Records saved before this keep their blank type until the next time they're saved."
