name: "Set how many highlighted stories show on the home page"
area: stories
display_status: admin_facing
released_on: 2026-10-23
action_path: "/admin/settings"
summary: >-
  App settings now caps the highlighted stories on the portal home, so you can
  feature more stories in Story Share without crowding the home page.
pro_tips:
  - "The cap counts only the stories each viewer is allowed to see, so visitors and signed-in users each get their newest ones."
  - "Leave it blank to show every featured story."
