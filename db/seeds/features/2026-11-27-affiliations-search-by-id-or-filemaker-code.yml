name: "Search affiliations by ID or a person's or org's FileMaker code"
area: people
display_status: admin_facing
released_on: 2026-11-27
pr_number: 3060
action_path: "/affiliations"
summary: >-
  The "Person or org name" search on the affiliations list also finds an affiliation by its portal ID,
  and a person's or organization's affiliations by their FileMaker code.
pro_tips:
  - "Person and organization portal IDs aren't searched there, since a person and an org can share one."
  - "The separate FM code box still searches the affiliation's own FileMaker code."
