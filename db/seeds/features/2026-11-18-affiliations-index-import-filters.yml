name: "Spot-check the FileMaker import from the affiliations index"
area: people
display_status: admin_facing
released_on: 2026-11-18
action_path: "/affiliations"
summary: >-
  Filter affiliations by what the FileMaker Personnel import did (created, linked to an existing
  one, or untouched) and by where it took an end date from. Each imported row shows its end-date
  source as a small badge, e.g. "Dec 31 stand-in".
