name: "Search payments by FileMaker code, check number, or Stripe ID"
area: payments
display_status: admin_facing
released_on: 2026-11-18
pr_number: 3019
action_path: "/payments"
summary: >-
  The payments Search box finds a payment by its FileMaker code, check number,
  Stripe charge ID, or Stripe transaction ID, so you can check whether a
  FileMaker payment is already in the portal even when the dates don't line up.
pro_tips:
  - "FileMaker codes match whole: D1234 won't also bring up D12345. A payment with several codes is found by any one of them."
  - "Part of a check number works: 00482 finds check 100482."
  - "From FileMaker, paste the ID after \"Trans ID:\" in Payment Details. If it doesn't hit, drop the pi_/ch_ prefix."
