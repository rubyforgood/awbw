name: "Move a field identifier between questions in one save"
area: registration
display_status: admin_facing
released_on: 2026-10-30
pr_number: 2917
action_path: "/forms"
summary: >-
  In the form editor you can now move, swap, or reuse a field identifier in one
  save, such as giving First Name's identifier to Preferred Name while changing
  First Name's. Two questions still can't keep the same identifier.
