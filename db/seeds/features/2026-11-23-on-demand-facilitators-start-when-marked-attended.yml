name: "On-demand facilitators start when marked Attended"
area: people
display_status: admin_facing
released_on: 2026-11-23
pr_number: 3044
summary: >-
  Signing up for an on-demand training creates an Upcoming facilitator
  affiliation, dated to the training's end. Marking them Attended starts it that
  day; un-marking puts it back.
pro_tips:
  - "A start date you set by hand is kept when attendance is un-marked."
