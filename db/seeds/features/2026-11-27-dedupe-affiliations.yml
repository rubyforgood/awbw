name: "Dedupe affiliations"
area: reporting
display_status: admin_facing
released_on: 2026-11-27
action_path: "/affiliations/dedupe_index"
summary: >-
  A new Dedupe affiliations page lists every person with the same affiliation
  saved more than once, and merges the copies into one.
description: >-
  <ul><li>Copies match when they share the organization, title, dates, and
  status — anything different is left alone.</li><li>The copy a registration
  created is kept, then the oldest. Comments move onto it, and a primary
  contact flag, address, or FileMaker code only one copy had is kept.</li></ul>
pro_tips:
  - "Reach it from the Dedupers section on admin home."
  - "Merge one person at a time with their Merge button."
