name: "Transferred-out registrations keep their no-show"
area: registration
display_status: admin_facing
released_on: 2026-11-13
action_path: "/transfer_guide"
summary: >-
  When someone who was a no-show (or partially attended) transfers to another
  training, their original "Transferred out" badge now carries the no-show or
  partial icon on rosters, the person's profile, and organization chips.
pro_tips:
  - "Hover the icon to see what it means."
  - "CSV exports spell it out: \"Transferred out (was no show)\"."
