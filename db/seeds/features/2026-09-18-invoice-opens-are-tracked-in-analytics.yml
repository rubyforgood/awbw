name: "Invoice opens are tracked in analytics"
area: reporting
display_status: admin_facing
released_on: 2026-09-18
pr_number: 2540
action_path: "/admin/activities/events"
summary: >-
  Opening a registrant or bulk-payment invoice now records a view in Ahoy
  analytics, so admins can see invoice activity in the Activity feed. Printing
  or downloading the PDF happens in the browser and isn't tracked.
