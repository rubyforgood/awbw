name: "New sectors and age groups are starred by default"
area: people
display_status: user_facing
released_on: 2026-10-17
pr_number: 2714
summary: >-
  When you pick a sector or age range for a person, or a sector or "Who is this
  story about?" tag for a story or story idea, and none is starred yet, the one
  you pick is starred as the primary.
pro_tips:
  - "Click a different star to move it, or click the star again to clear it."
