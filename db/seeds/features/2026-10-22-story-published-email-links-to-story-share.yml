name: "Story emails go to the story's authors and link to Story Share"
area: stories
display_status: user_facing
released_on: 2026-10-23
pr_number: 2780
summary: >-
  Story idea confirmations and "your story is live" emails now go to the credited author
  and second author. The live email links to the story on Story Share and is sent for stories
  created directly too.
pro_tips:
  - "Promoting an idea sends nothing; the author and admin hear about it when the story is first published."
  - "Funder-only stories send a \"shared with the funder\" email instead, since they never appear on Story Share."
  - "A story with no author credited sends no author email."
