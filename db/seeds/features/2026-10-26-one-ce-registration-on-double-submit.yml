name: "Reapplying keeps one CE registration and saves each application's CE answers"
area: registration
display_status: admin_facing
released_on: 2026-10-26
pr_number: 2876
summary: >-
  However many times someone applies, even with a double-submit, they keep one
  event registration, one CE registration, and one license. Each application now
  saves its own CE answers, so an earlier license number is no longer overwritten.
pro_tips:
  - "The ticket shows the newest CE answers; every application's answers are listed on the registrant's submissions page."
  - "Updating the license from the CE callout writes it onto the newest CE answers for that event."
action_path: "/events"
