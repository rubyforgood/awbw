name: "Choose who signs CE certificates"
area: events
display_status: admin_facing
released_on: 2026-10-22
action_path: /admin/settings
pr_number: 2570
summary: >-
  App settings now holds everything the continuing education certificate prints that
  isn't about the registrant: who signs it and their title, the approved-provider
  number, and the accrediting body with its link. All of it was fixed in the code, so
  only a developer could change any of it.
pro_tips:
  - "Change the signatory the day someone new takes over CE — certificates issued after that print the new name."
  - "Leave the provider number or accrediting body blank and the certificate simply omits that line."
  - "The signature image itself is a separate upload: the \"CE certificate signatures\" resource."
