name: "CE reports drop CE left unpaid past its payment deadline"
area: registration
display_status: admin_facing
released_on: 2026-11-02
pr_number: 2934
action_path: "/events"
summary: >-
  Once an event's CE payment deadline passes, CE that isn't paid in full stops
  counting in reports: the dashboard's CE fees card and CE pie, and the revenue
  report. Denied CE is left out the same way.
pro_tips:
  - "Money already collected still counts as paid, even on CE that stopped counting."
  - "CE timesheets still list CE marked intending to pay after the deadline, since those registrants can still sign in."
  - "Events without a CE payment deadline keep counting unpaid CE."
