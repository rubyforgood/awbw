name: "See each staff tag's taggings count"
area: people
display_status: admin_facing
released_on: 2026-10-17
action_path: "/staff_tags"
summary: >-
  The Staff tags list now shows each tag's taggings count. Click the number for
  that tag's taggings, or View people for the people list filtered to it.
pro_tips:
  - Use New staff tagging on the Staff tags list to tag someone and log a
    comment or communication at the same time. You land back on the list when
    you save.
