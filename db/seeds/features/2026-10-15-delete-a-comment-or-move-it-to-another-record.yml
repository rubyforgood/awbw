name: "Delete a comment or move it to another record"
area: communications
display_status: admin_facing
released_on: 2026-10-15
pr_number: 2701
summary: >-
  Filed a comment against the wrong record, or need it gone? Click Edit on the
  comment to delete it, or, in a person's comments feed, to change what it's
  logged against.
pro_tips:
  - "The \"Logged against\" picker lists the same records as the \"Add a note to\" composer: profile, user account, registrations, and more."
  - "On a record's edit page, click Edit in the comments section to see each comment's Delete link. It deletes right away; no need to save the page."
