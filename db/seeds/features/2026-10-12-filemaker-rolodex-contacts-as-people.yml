name: "FileMaker Rolodex contacts as people"
area: people
display_status: admin_facing
released_on: 2026-10-12
pr_number: 2630
summary: >-
  Contacts from the old FileMaker Rolodex can now be brought into the portal as
  people, carrying their FileMaker code, profile details, service areas and age
  group, and every address and phone number the old record held.
pro_tips:
  - "A contact who already has a portal record is linked to it rather than duplicated — matching takes the same name and the same email."
  - "A linked person's blank fields are filled in from FileMaker. Where FileMaker says something different, the portal's value is kept and a comment on the person lists what FileMaker had."
  - "A contact with no email is linked to a portal person of the same name who also has no email."
  - "A person can carry several FileMaker codes, so a contact who matches someone already linked to another FileMaker record is added to their list."
  - "FileMaker's old words for who someone serves are translated through the recorded tag aliases, so \"Student Services\" becomes Education and \"Families\" tags every age range."
  - "A contact whose email belongs to someone with a different name becomes a new person — merge them with the person deduper if they turn out to be the same."
  - "A person's FileMaker code on their page links straight to their row in the archive."
  - "An imported person carries their service areas, settings, life experiences, age group, facilitator start date, and every address and phone the old record held — and their profile dates from when FileMaker first knew them, not from the day they were imported."
action_path: "/people"
