name: "See whether background jobs are running, and restart the app"
area: reporting
display_status: admin_facing
released_on: 2026-10-29
action_path: "/admin/data_health"
summary: >-
  Data health now opens with a Background jobs light showing whether emails,
  Stripe payment updates, and other background work are going out. When
  they've stopped, an admin can restart the app from /admin/restart.
pro_tips:
  - "Red means the job runner has stopped checking in or work has waited over an hour. Restarting the app usually fixes it; the site is down for a minute or two."
  - "The restart page isn't linked from any menu on purpose. Type /admin/restart after the portal's address to reach it."
  - "After a restart, use Retry them on Data health to rerun anything that was mid-run when the runner stopped. Emails that already went out won't send twice."
