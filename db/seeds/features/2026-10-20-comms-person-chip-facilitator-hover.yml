name: "See a person's facilitator standing from their comments & communications"
area: communications
display_status: admin_facing
released_on: 2026-10-20
pr_number: 2766
summary: >-
  A person's comments & communications page now leads with their profile chip,
  and their name on each message from them links to their profile. Hover either
  to see when they first affiliated and each current facilitator affiliation,
  with the organization's status and when the term started or ends.
pro_tips:
  - "Dates close to today read in plain words, like \"ending next month\", so a lapsing term stands out."
