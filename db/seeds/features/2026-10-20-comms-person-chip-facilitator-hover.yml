name: "See who each comment or communication is about, and their facilitator standing"
area: communications
display_status: admin_facing
released_on: 2026-10-20
pr_number: 2766
summary: >-
  On the everyone view of comments & communications, each row now names the
  person it's about. A person's own page leads with their profile chip. Hover a
  name to see when they first affiliated and each current facilitator
  affiliation, with the organization's status and when the term started or ends.
pro_tips:
  - "Click a name on the everyone view to jump to just that person's comments & communications."
  - "Dates close to today read in plain words, like \"ending next month\", so a lapsing term stands out."
