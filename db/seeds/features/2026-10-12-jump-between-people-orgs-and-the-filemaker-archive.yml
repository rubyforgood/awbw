name: "Jump between people, orgs, and the FileMaker archive"
area: people
display_status: admin_facing
released_on: 2026-10-12
pr_number: 2648
summary: >-
  Each FileMaker code on person and organization edit pages links to its
  archive record, and each archive record links back to the portal person or
  organization that carries its code.
description: >-
  <ul><li>An organization's edit page also links the FileMaker organization its
  project belongs to.</li><li>An organization's code can be a FileMaker project
  ID (like P2775) or organization ID (like ORG07206). Type the whole code,
  letters included.</li></ul>
pro_tips:
  - "A struck-through code means the archive has no record for that code — check it for a typo."
  - "Separate several codes with commas. Spaces, tabs, and line breaks are ignored, and the list saves sorted."
