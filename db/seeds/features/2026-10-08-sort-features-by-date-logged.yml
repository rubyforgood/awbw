name: "Sort features by date logged"
area: content
display_status: admin_facing
released_on: 2026-10-08
action_path: "/features"
pr_number: 2624
summary: >-
  The Features & tips page can now sort by the date a feature was logged on the
  page, alongside the existing sort by release date.
description: >-
  <ul><li>Set it back to "—" (or click Clear filters) to return to sorting by
  release date.</li></ul>
pro_tips:
  - "Pick a direction under \"Sort: logged\" to see the most recently added entries first; release date then breaks ties."
  - "While sorting by date logged, each card shows both dates, labeled Logged and Released."
