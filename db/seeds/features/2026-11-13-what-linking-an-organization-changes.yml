name: "What linking an organization changes"
area: people
display_status: admin_facing
released_on: 2026-11-13
pr_number: 2997
action_path: "/form_submissions"
summary: >-
  One place to check exactly what a form's answers change when it's submitted or
  linked to an organization: the organization's address and phone, the person's
  affiliations and phone, and what the confirmation message reports.
pro_tips:
  - "The same rules apply when you link from an event's Registrants page (Link organizations) or from a form submission."
description: |
  <p><strong>Org address</strong></p>
  <ul>
    <li><strong>No match → new primary work address.</strong> Old primary stays, loses the flag.
      <ul><li>A match is same street plus same city and state, or same street plus ZIP.</li></ul>
    </li>
    <li><strong>Match → updated.</strong> ZIP and country overwritten, blanks filled, reactivated. Primary only if the org has no active primary.</li>
    <li><strong>No state → not saved.</strong></li>
  </ul>
  <p><strong>Org phone</strong></p>
  <ul>
    <li><strong>New number → new primary work phone.</strong> Old primary stays, loses the flag.</li>
    <li><strong>Known number (ignoring formatting) → reactivated.</strong> Primary only if the org has no active primary.</li>
    <li><strong>Blank → not saved.</strong></li>
  </ul>
  <p><strong>Person's affiliations</strong></p>
  <ul>
    <li><strong>New and current (active or upcoming) ones at the org</strong> get the new address, whatever their title.</li>
    <li><strong>No address submitted:</strong> the org's only active address fills affiliations that have none.</li>
    <li><strong>Unchanged:</strong> ended affiliations, and other people's.</li>
  </ul>
  <p><strong>Facilitator affiliation</strong></p>
  <ul>
    <li>Created only by facilitator trainings, on-demand agreements and reinstatement agreements.</li>
    <li>Skipped if the person already has a current one at the org.</li>
  </ul>
  <p><strong>Person's phone</strong> (set when the form is submitted, not on link)</p>
  <ul>
    <li>Becomes their primary; a known number is reactivated.</li>
    <li><strong>Old primary is made inactive.</strong></li>
  </ul>
  <p><strong>Flash</strong> reports each change: “Primary work address (was …)”, “Primary phone (was …)”, “Facilitator affiliation address (was …)”.</p>
