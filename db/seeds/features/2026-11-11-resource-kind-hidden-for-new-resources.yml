name: "Resource kind retired for new resources"
area: content
display_status: admin_facing
released_on: 2026-11-11
pr_number: 2980
action_path: "/resources/new"
summary: >-
  The Kind dropdown on a resource no longer offers the old catch-all "Resource"
  kind. Resources already filed under it keep it as an option until you pick a
  more specific kind.
