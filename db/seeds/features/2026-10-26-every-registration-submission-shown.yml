name: "See every registration submission, not just one"
area: registration
display_status: admin_facing
released_on: 2026-10-26
pr_number: 2881
summary: >-
  When someone registers more than once, or sends a form on its own later, every
  submission now shows up. Their form responses page opens the newest registration
  and tucks earlier ones underneath. The edit registration page links and audits
  each one.
pro_tips:
  - "A registration and the scholarship or CE form sent with it count as one submission; a form sent on its own later counts separately."
  - "A small number on the form icon (registrants and event registrations pages) is how many times the person submitted."
  - "Each submission link on the edit registration page names the form and date, and jumps straight to that submission."
  - "The submissions page groups each registration with the forms sent alongside it."
  - "The submissions page's back link returns to whichever page you opened it from."
