name: "See every registration submission, not just one"
area: registration
display_status: admin_facing
released_on: 2026-10-26
pr_number: 2881
summary: >-
  When someone submits the registration form more than once, every submission
  now shows up: their form responses page opens the newest and tucks the
  earlier ones underneath, and the edit registration page links and audits
  each one.
pro_tips:
  - "A small number on the form icon (registrants and event registrations pages) means the person has more than one submission."
  - "Each submission link on the edit registration page names the form and date, and jumps straight to that submission."
  - "The submissions page's back link returns to whichever page you opened it from."
