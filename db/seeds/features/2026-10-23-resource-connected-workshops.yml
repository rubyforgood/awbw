name: "See a resource's workshops"
area: content
display_status: admin_facing
released_on: 2026-10-23
action_path: "/resources"
summary: >-
  A resource page now lists the workshops it's connected to: any workshop that mentions the
  resource in its text, or that the resource mentions in its own.
pro_tips:
  - "To connect a resource to a workshop, edit the workshop and type # plus the resource's title in a text box like Materials needed."
