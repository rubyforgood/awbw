name: "Merges tidy up duplicate addresses and phone numbers"
area: people
display_status: admin_facing
released_on: 2026-09-29
action_path: "/people/dedupe_index"
summary: >-
  Merging two people now merges identical addresses and phone numbers into one
  instead of leaving the kept person with duplicates, and keeps a single primary.
description: >-
  When two people share the same address or phone number, the merge now keeps
  just one copy and moves anything attached to the duplicate (like a phone tied
  to an address) onto the survivor. The copy it keeps is the one still in use —
  an active address or phone always wins over one marked inactive — and any
  detail only the other copy had (a phone number on an address, for example) is
  filled in rather than lost. It also settles a single primary — the kept
  person's own if they had one, otherwise the other person's — so you never end
  up with two "primary" addresses or phones. Addresses or phones that genuinely
  differ are all kept.
