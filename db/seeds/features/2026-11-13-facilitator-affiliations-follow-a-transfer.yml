name: "Facilitator affiliations follow a transfer"
area: events
display_status: admin_facing
released_on: 2026-11-13
action_path: "/events/1/registrants"
pr_number: 3002
summary: >-
  When you record where a registrant transferred, the facilitator affiliation their
  registration created moves with them automatically. It's dated from the new
  training and tied to the new registration, with nothing to reconcile.
description: >-
  <p><strong>Related:</strong> <a href="/features?query=Reconcile+affiliations+after+a+training">Reconcile affiliations after a training</a> (how to use the page)</p>
pro_tips:
  - "Undoing the transfer moves the affiliation back. An older facilitator affiliation with the organization is never re-dated, so the years before stay on record."
  - "Nothing moves if the new event isn't a facilitator training or isn't linked to the same organization. Reconcile affiliations lists those, and transfers recorded before this change, for you to update by hand."
