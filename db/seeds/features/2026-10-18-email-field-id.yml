name: "Use email or primary_email as the email question's field ID"
area: content
display_status: admin_facing
released_on: 2026-10-18
summary: >-
  An email question with the field ID "email" now identifies the person who
  submits the form, the same as "primary_email", so their answers can update
  their profile.
pro_tips:
  - "The form editor saves \"email\" as \"primary_email\". Re-save an older form to switch an existing \"email\" question over."
