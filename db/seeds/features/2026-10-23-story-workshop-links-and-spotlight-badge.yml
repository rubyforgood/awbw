name: "Stories link every workshop and name spotlighted facilitators"
area: stories
display_status: user_facing
released_on: 2026-10-23
pr_number: 2792
summary: >-
  A story's page now links each workshop it came from and names its spotlighted facilitator.
  On a workshop's page, spotlight stories carry a "Facilitator spotlight" badge with the
  facilitator's name.
pro_tips:
  - "Add more than one workshop to a story from the story's edit page; each shows as its own link."
  - "The spotlighted name follows the facilitator's display name preference on their profile."
