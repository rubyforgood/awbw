name: "Deliver a form on a ticket callout and see who completed it"
area: registration
display_status: admin_facing
released_on: 2026-08-29
pr_number: 2384
action_path: "/registration/sample"
summary: >-
  Attach a form to any ticket callout and registrants fill it out from their ticket,
  then see their answers when they come back. The registrants list's "Ticket forms"
  toggle shows who has completed each one.
