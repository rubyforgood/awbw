name: "File upload questions accept documents, up to 25 MB"
area: registration
display_status: admin_facing
released_on: 2026-08-17
pr_number: 2217
summary: >-
  File upload questions on registration forms now accept PDFs, Word documents, and
  GIFs as well as photos, up to 25 MB. A file already uploaded is kept when another
  answer on the form has an error.
