name: "Educational institution organization type"
area: people
display_status: admin_facing
released_on: 2026-10-25
summary: >-
  Organizations can now be typed as an "Educational institution" — schools, colleges, and
  universities no longer have to be filed under Other.
pro_tips:
  - "The FileMaker import reads school, college, and university types as Educational institution."
  - "Existing registration forms keep their old Organization type choices; add the new one in the form editor if you want it offered there."
