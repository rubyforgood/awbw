name: "Two people with the same name need an email to tell them apart"
area: people
display_status: admin_facing
released_on: 2026-10-21
pr_number: 2646
action_path: "/people/new"
summary: >-
  A person with no email saves fine. A second with the same name does not — the portal asks for
  their own address, and names a placeholder (1@example.com, then 2@example.com) for when they
  genuinely have none. A placeholder counts as no address, so those people get no emails.
pro_tips:
  - "Use the placeholder the error names — it skips any already taken for that name."
  - "Search people for example.com to pull up everyone marked with a placeholder."
