name: "See who finished each training survey"
area: registration
display_status: admin_facing
released_on: 2026-10-18
pr_number: 2748
action_path: "/events"
summary: >-
  The registrants list and the onboarding tracker show the date each person
  completed the Day 1, Day 2, post-event, and scholarship surveys. The columns
  fill in on their own as surveys come in.
pro_tips:
  - "On the registrants list, turn on the Surveys switch to see the columns."
  - "Click a survey date to open that person's answers."
