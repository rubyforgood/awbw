name: "Review leftover Leader affiliations"
area: people
display_status: admin_facing
released_on: 2026-10-24
pr_number: 2788
summary: >-
  A review page lists affiliations still titled Leader, which don't count toward
  program status, so you can merge, rename, end, or delete each one — previewing
  every change before it's made.
pro_tips:
  - "Open it from Data health → Affiliations still titled Leader → Review."
  - "A Leader row with a Facilitator row for the same dates suggests merging into it, so no duplicate is left behind."
  - "A Leader row whose dates overlap a Facilitator row's but don't match is left as is unless you pick a change."
  - "Every change except Delete leaves a comment saying the affiliation was a Leader."
action_path: "/admin/leader_affiliations"
