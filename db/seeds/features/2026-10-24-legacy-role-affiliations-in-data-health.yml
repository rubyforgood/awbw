name: "See leftover old-app role affiliations in Data health"
area: people
display_status: admin_facing
released_on: 2026-10-24
pr_number: 2788
summary: >-
  Data health lists affiliations still titled Leader, Liaison, Assistant or
  "default" — the old app's roles, which don't count toward program status — each
  with the person's Facilitator affiliations there, so you can open the person
  and clean it up.
pro_tips:
  - "Find it under Data health → Affiliations → Affiliations still titled with an old-app role."
  - "Each row says whether the person already has a Facilitator affiliation at that organization, and lists it."
  - "A row marked “same dates” sits beside a Facilitator affiliation that already covers it; one marked “overlaps with different dates” needs a look at which dates are right."
  - "Each name opens the person's edit page at that affiliation, and its back link returns you to Data health."
action_path: "/admin/data_health"
