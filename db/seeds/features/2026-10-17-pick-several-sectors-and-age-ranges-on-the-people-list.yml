summary: >-
  The people list's Sector and Age range filters are now searchable dropdowns
  where you can pick more than one. The list shows everyone tagged with any of
  your picks.
pro_tips:
  - "A filter matches a person's primary and additional tags, even though each row shows only the primary ones."
