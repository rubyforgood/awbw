name: "Merge preview shows each person's login"
area: people
display_status: admin_facing
released_on: 2026-10-24
action_path: "/people/dedupe_index"
summary: >-
  When merging people, emails that sign in to a login are tagged with the
  login's last sign-in, and moving logins show their email, lock, and invite
  status.
pro_tips:
  - "When both people have a login, the kept person's primary email becomes the email of the login used most recently."
  - "If neither login has been used, it becomes the email of the login whose person has affiliations or event registrations."
  - "When nothing tells the two logins apart, the kept person's login wins."
  - "Hover the lock or envelope icon to see why a login can't sign in or when it was invited."
