name: "Merging takes over a login's email"
area: people
display_status: admin_facing
released_on: 2026-10-12
pr_number: 2644
action_path: "/people/dedupe_index"
summary: >-
  When the person you keep has no login but the other person does, the kept
  person takes over that login. Their primary email stays the one you chose, and
  the login's email is kept as their secondary email.
pro_tips:
  - "The merge preview warns you when this will happen."
  - "If the kept person has no primary email, the login's email becomes their primary email."
