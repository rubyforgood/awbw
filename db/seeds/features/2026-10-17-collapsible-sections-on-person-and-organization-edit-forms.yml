name: "Collapsible sections on the person and organization edit forms"
area: people
display_status: admin_facing
released_on: 2026-10-17
pr_number: 2038
action_path: "/people"
summary: >-
  The person and organization edit pages now collapse each section to a one-line
  summary of what's on file, so you can see the whole record at a glance and open
  only the part you're changing.
description: >-
  Every section — emails, phones, addresses, sectors, age ranges, staff tags,
  affiliations, background, licenses, social media links, profile display
  preferences, comments & communications, and membership — shows its current value
  on the header line: the sectors you've tagged (with the primary starred and a
  sector leader crowned), the addresses on file, how many comments and
  communications there are, and which profile fields are hidden. Click a header to
  expand it. Sections open automatically when you're creating a record, when a save
  fails, or when a link sends you straight to one.
pro_tips:
  - "Links that point at a section — a comment icon, or returning from the affiliation editor — open it for you and scroll to it."
  - "Nothing is hidden from a save: collapsed fields are still part of the form, so a collapsed section keeps its values."
