name: "Rich text editor shows paragraph spacing as it will appear"
area: content
display_status: user_facing
released_on: 2026-10-24
summary: >-
  The rich text editor now shows the same gap between paragraphs as the saved page, so a story or
  resource looks the same while you write it as it does once published.
pro_tips:
  - "Press Enter once between paragraphs. Extra blank lines add extra space on the page."
