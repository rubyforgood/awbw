name: "See and filter features by who added them"
area: content
display_status: user_facing
released_on: 2026-10-09
action_path: "/features"
pr_number: 2634
summary: >-
  Each feature's detail page now shows who added it, and the Features & tips
  page can be filtered to features added by a specific person or by any admin.
pro_tips:
  - "Pick \"Admins\" under \"Created by\" to see every entry an admin logged."
  - "Set it back to \"Any\" (or click Clear filters) to see everything again."
