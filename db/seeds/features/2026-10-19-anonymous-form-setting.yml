name: "Anonymous form setting"
area: registration
display_status: admin_facing
released_on: 2026-10-19
pr_number: 2754
summary: >-
  Turn on "Anonymous responses" in a form's settings so answers aren't linked to
  whoever submits them — on a public link or a ticket callout, even when they're
  logged in.
pro_tips:
  - "Someone is credited only when they fill in first name, last name, and email; anything less stays anonymous."
  - "On a ticket callout, the registrants list still checks off who completed the form — just not which answers are theirs."
  - "Anonymous answers can't be reviewed or changed by the person after they submit."
