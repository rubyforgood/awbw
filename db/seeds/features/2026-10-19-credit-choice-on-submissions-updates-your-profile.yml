name: "Your credit choice on a submission updates your profile"
area: people
display_status: user_facing
released_on: 2026-10-19
pr_number: 2759
action_path: "/story_share/new"
summary: >-
  "How should we credit you?" on the story and workshop variation forms now saves to
  your profile, so the choice covers everything you've shared, not just that submission.
pro_tips:
  - "Picking \"Don't credit me by name\" turns on \"Contribute anonymously\" for all your content."
  - "The form starts on your current profile setting, so leave it as is to keep things the same."
