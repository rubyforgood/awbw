name: "Scholarship dollars move with a transfer to an earlier training"
area: scholarships
display_status: admin_facing
released_on: 2026-11-10
pr_number: 2975
action_path: "/transfer_guide"
summary: >-
  When someone transfers to a training that happens earlier, their scholarship dollars now count toward
  that earlier training in dashboards and reports. Transfers to a later training keep the dollars at the original.
pro_tips:
  - "Payments always stay with the training they were paid on."
  - "The recipient card's \"Billed to original event\" pill only shows when the dollars stayed behind."
