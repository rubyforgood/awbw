name: "Facilitator affiliations follow a transfer"
area: events
display_status: admin_facing
released_on: 2026-08-29
action_path: "/events/1/reconcile_affiliations"
pr_number: 2195
summary: >-
  When a registrant transfers to another training, Reconcile affiliations offers to
  move their facilitator affiliation to the new event, dated from its start and tied
  to the new registration, rather than ending or deleting it.
description: >-
  <p><strong>Related:</strong> <a href="/features?query=Reconcile+affiliations+after+a+training">Reconcile affiliations after a training</a> (how to use the page)</p>
pro_tips:
  - "Record where they transferred to first. Until you do, the row waits under Not reconciled. Nothing moves if the new event isn't linked to the same organization."
  - "If their affiliation with that organization has already ended, a new one is created at the new event and the ended one stays as history."
