name: "Credit two authors on a story"
area: stories
display_status: admin_facing
released_on: 2026-10-03
summary: >-
  A story can now credit a second author alongside the first, and bylines include
  each author's credentials — "Mae Beale, LMFT, MSW and Cathy S." Name search and
  the author filter find either one, the story shows on both profiles, and home
  page cards now name their author(s).
action_path: "/stories"
