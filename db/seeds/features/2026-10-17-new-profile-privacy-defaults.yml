name: "New profiles start with more private defaults"
area: people
display_status: user_facing
released_on: 2026-10-17
summary: >-
  New profiles now show the person's first name and last initial, and keep
  pronouns, phone, and social media hidden until the person turns them on.
  Everything else on the profile is still shown by default.
pro_tips:
  - "Existing profiles keep their current settings."
  - "Change these under Profile display preferences on the profile's edit page."
