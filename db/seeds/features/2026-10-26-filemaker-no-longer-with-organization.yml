name: "FileMaker import ends affiliations noted as \"no longer with organization\""
area: people
display_status: admin_facing
released_on: 2026-10-26
pr_number: 2872
summary: >-
  When a FileMaker affiliation's notes say the person is no longer with the
  organization, the import ends that affiliation and keeps the note as a comment.
pro_tips:
  - "FileMaker never recorded when they actually left, so the end date is the day staff last saved that row."
  - "The comment says the real end date isn't known."
  - "A program assignment that already has a close date keeps it."
action_path: "/organizations"
