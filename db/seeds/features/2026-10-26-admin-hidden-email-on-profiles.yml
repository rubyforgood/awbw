name: "Hidden emails show to admins on profiles"
area: people
display_status: admin_facing
released_on: 2026-10-26
summary: >-
  When a person or organization turns off "Show email," admins still see the
  email at the top of the profile, on a locked admin-only chip.
pro_tips:
  - "A person's primary email now sits beside their secondary email, so you no longer have to scroll to the Hidden from profile card to find it."
