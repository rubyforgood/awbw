name: "Request a change to your profile's locked details"
area: people
display_status: admin_facing
released_on: 2026-10-05
summary: >-
  On your own profile, the details only AWBW staff can edit — your primary
  email, organization name, and affiliation history — now have a "Request a
  change" link right beside them. Send us what should change and staff review
  it, so you can get a correction made without hunting for who to email.
pro_tips:
  - >-
    The form shows the current value and pre-fills what you're asking about —
    just add the correction and send.
pr_number: 2543
