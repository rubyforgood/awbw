name: "Form answers update organization profiles"
area: people
display_status: admin_facing
released_on: 2026-11-13
pr_number: 2986
summary: >-
  The latest valid organization answers from any form, link, or import now update the organization's
  website, type, and work address. Answers that can't be applied are listed as not applied.
pro_tips:
  - "After linking, the warning names any saved values the form replaced, so you can reapply newer edits. Previous values are in the activity log."
  - "A website answer that isn't a web address, or an address missing its city or state, is never saved and shows as not applied."
  - "If someone's affiliation points at a different office than the one they submitted, the link page flags it."
