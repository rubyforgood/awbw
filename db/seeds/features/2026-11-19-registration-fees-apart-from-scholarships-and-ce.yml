name: "See registration fees apart from scholarships and CE"
area: reporting
display_status: admin_facing
released_on: 2026-11-19
action_path: "/events/revenue"
pr_number: 3032
summary: >-
  The revenue report and event dashboard now show registration fees and CE
  fees separately, then collected for both, so a training's income isn't double
  counted with grant-funded scholarships.
pro_tips:
  - "Totals that still add scholarships and CE are labeled \"incl. scholarships\" or \"all sources\"."
