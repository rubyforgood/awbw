name: "Jump to one person's change requests"
area: people
display_status: admin_facing
released_on: 2026-10-15
summary: >-
  When someone has profile change requests, their edit page shows a Change
  requests button at the top that opens the queue filtered to just them.
pro_tips:
  - "The button shows how many are pending, and opens on Pending when there are any."
