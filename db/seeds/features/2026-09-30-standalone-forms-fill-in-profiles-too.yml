name: "Standalone forms fill in profiles too"
area: people
display_status: admin_facing
released_on: 2026-09-30
action_path: "/forms"
pr_number: 2609
summary: >-
  Contact and profile smart fields (secondary email, phone, address, pronouns, name
  pronunciation, sectors, age groups) and the submitted organization now save from a
  standalone form the same way as on an event registration, for new and existing
  people. The latest answer wins.
description: >-
  <ul><li>Any other form fills in the organization's details and adds the job
  affiliation from the position they typed, exactly as an event registration
  does.</li></ul>
pro_tips:
  - "The changes land on the person's \"What this submission changed\" audit, so you can see exactly what a submission updated — including a tag it removed or reassigned."
  - "An agreement form (on-demand, new job, reinstatement, close program) whose organization name matches exactly is now processed the moment it arrives, exactly as if you had clicked \"Link organization\" yourself. If the name matches nothing, or matches two organizations, it stays in your queue to resolve."
