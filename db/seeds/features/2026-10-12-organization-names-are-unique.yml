name: "Organization names are unique"
area: people
display_status: admin_facing
released_on: 2026-10-12
pr_number: 2637
action_path: "/organizations/dedupe_index"
summary: >-
  Two organizations can no longer share the same name. Names that differ only
  by capitalization or extra spaces count as the same name.
pro_tips:
  - "To tell apart two real organizations with the same name, add the city or program, e.g. \"Hope House (Oakland)\"."
  - "Use Dedupe on the Organizations page to combine records that already exist twice."
