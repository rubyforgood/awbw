name: "Story images share one standard shape"
area: stories
display_status: user_facing
released_on: 2026-10-12
pr_number: 2654
action_path: "/story_share"
summary: >-
  Story Share cards and images now use one standard 3:2 shape, and the
  image upload on stories and story ideas says which photos look best.
description: >-
  <ul><li>Tall photos and artwork still show in full on a blurred
  background.</li></ul>
pro_tips:
  - "For the best fit, upload landscape photos in a 3:2 shape, at least 1800 × 1200 pixels. A recent phone photo taken sideways works well."
  - "Wide banners at the top of the home and browse pages trim a little off the top and bottom, so keep the main subject near the center."
