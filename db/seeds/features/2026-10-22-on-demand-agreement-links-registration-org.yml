name: "On-demand agreements link the organization on the registrants roster"
area: registration
display_status: admin_facing
released_on: 2026-10-22
pr_number: 2771
summary: >-
  An on-demand agreement's organization now shows as linked on the registrants
  roster — automatically when the typed name matches an organization on file, or
  as soon as you link it from either the roster or the form submission page.
pro_tips:
  - "Link a mismatched name from whichever page you're on — the roster, the submission, and the person's job and facilitator affiliations all update together."
  - "The submission's linking page lists exactly what linking will change (registration, job title, Facilitator) before you click."
  - "Linking a second organization from the submission adds it to the registration without repeating the form's answers against it."
