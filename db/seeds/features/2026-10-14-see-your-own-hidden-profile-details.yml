name: "See your own hidden profile details"
area: people
display_status: user_facing
released_on: 2026-10-14
pr_number: 2672
action_path: "/people"
summary: >-
  Details you turn off in your profile's sharing settings stay hidden from
  other people on the people list and your profile. You still see them
  yourself in a collapsible "Hidden from profile" section on your profile.
pro_tips:
  - "On the people list, an eye-slash icon marks your own details that only you and admins can see."
  - "Use \"Change sharing settings\" in the Hidden from profile section to turn something back on."
  - "Submitted content (your ideas, workshop logs, and monthly reports) is always private to you and admins, so it has no sharing setting."
  - "Admins see the same Hidden from profile section on anyone's profile."
