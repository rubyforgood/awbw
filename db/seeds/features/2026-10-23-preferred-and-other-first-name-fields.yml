name: "Preferred and other first name questions replace nickname"
area: registration
display_status: admin_facing
released_on: 2026-10-23
action_path: "/forms/smart_form_settings"
summary: >-
  New forms ask for a "Preferred first name" (first_name), and the contact info section asks
  for an optional "Other first name" (legal_first_name) where it used to ask for a nickname.
  The nickname field identifier no longer changes a person's name.
pro_tips:
  - "Other first name explains that it only helps us find someone's existing record, and that we'll always use their preferred name."
  - "On a person's profile, the other first name shows to admins only."
  - "An existing question keyed nickname still saves its answer on the submission, but no longer sets the person's first name."
