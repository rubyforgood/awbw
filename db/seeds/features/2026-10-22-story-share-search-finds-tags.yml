name: "Story Share search now also finds stories by topic and audience"
area: stories
display_status: public_facing
released_on: 2026-10-22
pr_number: 2786
action_path: /story_share?query=teens
summary: >-
  Story Share search looks in each story's title, story text, author or second
  author name, and spotlighted facilitator. It now also finds stories tagged
  with a matching sector, age range, or story population, even when the story
  never uses the word.
pro_tips:
  - Results show as an easy-to-scan list, with title matches first.
  - Above the results, a line says what your search matched. Click a tag there
    to see every story with that tag.
  - Anonymous authors can't be found by name.
  - No results? Try one of the suggested topics, or share a story of your own.
