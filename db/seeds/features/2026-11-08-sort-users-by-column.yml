name: "Sort the users list by column"
area: people
display_status: admin_facing
released_on: 2026-11-08
pr_number: 2971
action_path: "/users"
summary: >-
  Click a column header on the users list (email, person, confirmed, access, or admin) to sort by it.
  Click again to reverse the order.
pro_tips:
  - "Sorting keeps your current filters, so you can sort just the unconfirmed accounts."
