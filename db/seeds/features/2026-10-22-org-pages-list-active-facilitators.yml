name: "Organization pages list active facilitators"
area: people
display_status: user_facing
released_on: 2026-10-22
pr_number: 2785
summary: >-
  An organization's people list now shows facilitators only the active facilitators whose profiles
  they can open, so every name on it leads to a profile.
pro_tips:
  - "A facilitator's card still shows their other titles at the organization, like Director."
  - "Admins still see everyone affiliated with the organization; a lock marks people facilitators can't open."
  - "On My bookmarks, a creator whose profile you can't open shows as a plain name."
