name: "Comments & communications on payments"
area: communications
display_status: admin_facing
released_on: 2026-11-13
summary: >-
  A payment's edit page now has the same combined "Comments & communications" section as
  grants and scholarships, so you can record notes about a payment and log calls or emails
  with its payer right on the payment.
pro_tips:
  - "A logged communication is addressed to the payment's payer, so you never type the email."
  - "A payment's comments also show in the combined feed of the person named on it, as payer or additional designation."
