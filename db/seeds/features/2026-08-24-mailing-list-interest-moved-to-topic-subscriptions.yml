name: "Mailing-list interest moved to topic subscriptions"
area: people
display_status: admin_facing
released_on: 2026-08-24
action_path: "/people/1"
pr_number: 2358
summary: >-
  The person editor's old "mailing list consent" checkbox is gone; it now links to that
  person's News subscriptions, where mailing-list interest is tracked. Registration and
  public form consent answers now create a News subscription, sourced to the event or form.
