name: "Ask to change your work address"
area: people
display_status: user_facing
released_on: 2026-10-17
summary: >-
  Each role on your profile now shows its work address right under the title.
  To add or change it, use that role's "Request a change" button, then pick
  one of your organization's addresses or enter the street, city, state, and ZIP.
pro_tips:
  - "Use \"Anything else you'd like us to know?\" for context, like when you moved."
  - "Admins: Approve sets the work address in one click. A newly entered address is added to the organization, or matched to one it already has."
pr_number: 2722
