name: "Staff-filed change requests are marked"
area: people
display_status: admin_facing
released_on: 2026-11-13
pr_number: 2994
action_path: "/profile_change_requests"
summary: >-
  A change request staff filed for someone shows a Staff badge in the queue, with whose profile it's
  for and who submitted it. Requests people sent themselves still read "Requested by".
pro_tips:
  - "Reviewing a staff-filed request emails the admin who filed it, not the person."
