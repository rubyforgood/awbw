name: "Organization pages list active facilitators"
area: people
display_status: admin_facing
released_on: 2026-10-23
pr_number: 2785
summary: >-
  An organization page now lists its active facilitators, and facilitators see only the ones whose
  profiles they can open, so every name leads to a profile.
pro_tips:
  - "A facilitator's card still shows their other titles at the organization, like Director."
  - "Admins see every active facilitator; a lock marks the ones hidden from facilitators, who don't see those cards."
  - "On My bookmarks, a creator whose profile you can't open shows as a plain name."
