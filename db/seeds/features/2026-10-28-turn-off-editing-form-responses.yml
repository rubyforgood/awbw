name: "Turn off editing form responses after submitting"
area: registration
display_status: admin_facing
released_on: 2026-10-28
summary: >-
  A new form setting, "Let people edit their responses after submitting," decides
  whether a form opened from a registration ticket shows an Edit responses link
  once it's sent. It's on by default.
pro_tips:
  - "Anonymous responses can never be changed once submitted, whatever this setting says."
  - "Staff can still edit any submission."
