name: "Prefixed contact search on the attendees page"
area: reporting
display_status: admin_facing
released_on: 2026-10-25
pr_number: 2844
summary: >-
  The attendees page now has the same admin-only "Contact info" box as the people
  index, where you can type a prefix to search one part of someone's address —
  "city: austin", "county: travis", "zip: 78701". Its main search box is now name
  or email, matching the people index.
pro_tips:
  - "Prefixes: phone:, street:, city:, state:, zip:, county:, country:, locality:, district:. Type several and each narrows the list further."
  - "With no prefix, the term is searched across all of those fields at once."
  - "This box reads the person's OWN address, while the City, State and County filters next to it read where they work on these registrations — so the two can disagree, on purpose."
  - "Both boxes are super-admin only; nobody else sees them."
