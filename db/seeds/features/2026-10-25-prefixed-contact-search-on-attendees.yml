name: "Attendees page: search by contact info and by where they work"
area: reporting
display_status: admin_facing
released_on: 2026-10-25
pr_number: 2857
summary: >-
  The attendees page's search box is now Name or email, matching the people
  index, with two new boxes beside it: a super-admin "Their own contact info"
  box, and a "Where they work" box that replaces the old City field.
pro_tips:
  - "Their own contact info reads the person's own address. Where they work reads the organization address on their registrations. The two can disagree, on purpose."
  - "Where they work takes city:, county:, state:, country:, locality:, zip:, district: and the LA district prefixes — so locality and school district are filterable here for the first time."
  - "The State and County dropdowns still win over the same field typed into the box."
  - "Both new boxes are super-admin only."
