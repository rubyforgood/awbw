name: "Free first membership year for invited live-training registrants"
area: payments
display_status: admin_facing
released_on: 2026-11-05
pr_number: 2943
action_path: "/events"
summary: >-
  Sending a system invite to a live facilitator training registrant who has no
  membership and no login yet now starts their membership with a free ($0)
  first year. It renews at the standard price.
pro_tips:
  - "On-demand trainings don't qualify, and other welcome emails no longer start a membership."
