name: "Admin home: system settings & details section, action counts, and clearer card names"
area: reporting
display_status: admin_facing
released_on: 2026-10-17
pr_number: 2720
action_path: "/admin"
summary: >-
  Admin home has a new System settings & details box for Banners, FAQs,
  Features & tips, and Smart resource settings, and a few cards now use the
  same names as the rest of the portal.
pro_tips:
  - "Renamed cards: Portal activity is now Activity, Licenses is now Professional licenses, and Resource roles is now Smart resource settings."
  - "Admins can open Tagging counts from a button at the top of the Tags page."
  - "Data health and Author credit divergences show how many items are waiting, and Sync features & tips shows how many new entries are ready to add. The counts load a moment after the page."
