action_path: "/continuing_education_registrations"
summary: >-
  The CE edit page has Approved and CE certificate of completion switches beside
  CE hours, saved with the form. The CE registrations list adds an Approval
  column and filter, and fits its filters on one row.
pro_tips:
  - "The license hint links to the license record, which brings you back to the CE registration when you save."
  - "Filter the CE registrations list by Approved or Not approved."
