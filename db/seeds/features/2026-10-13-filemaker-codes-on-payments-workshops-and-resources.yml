name: "FileMaker codes on payments, workshops, and resources"
area: content
display_status: admin_facing
released_on: 2026-10-13
pr_number: 2656
summary: >-
  The payment, workshop, and resource editors now show each record's FileMaker
  code so admins can see and fix it, the same way people and organizations do.
pro_tips:
  - "Separate several codes with commas — a record can answer to more than one."
  - "Each code links to its FileMaker archive record, and that record links back to the payment or workshop."
