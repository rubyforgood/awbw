name: "Registrant charts show where people work"
area: reporting
display_status: admin_facing
released_on: 2026-10-25
pr_number: 2842
summary: >-
  The cities, states, and countries charts on an event's roster, the
  attendees page, and the scholarship recipients page now count each
  registrant where they work: the address of the organization they
  registered under.
pro_tips:
  - "If the registrant picked one of the organization's addresses, that one counts. Otherwise the organization's first address on file counts."
  - "The roster's State and County filters still match the registrant's own address."
