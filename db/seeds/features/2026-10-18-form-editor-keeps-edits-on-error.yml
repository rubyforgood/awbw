name: "Form editor keeps your edits when a question is too long"
area: registration
display_status: admin_facing
released_on: 2026-10-18
summary: >-
  If one question or answer option is over its length limit, the form editor
  keeps all your other edits on the page and names the question to fix, so
  one correction and Save keeps everything.
pro_tips:
  - "Click the question name in the red box at the top to jump straight to it."
  - "Question text and answer options each hold up to 1,000 characters; put longer instructions in the question's subtitle or hint."
