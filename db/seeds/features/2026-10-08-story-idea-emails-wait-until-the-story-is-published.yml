name: "Story idea emails wait until the story is published"
area: stories
display_status: admin_facing
released_on: 2026-10-08
pr_number: 2620
summary: >-
  When a story idea becomes a story, the submitter's "your story has been
  shared" email and the admin FYI now go out the first time the story is
  published, so the submitter gets a working link to their live story.
pro_tips:
  - "Saving a promoted story as unpublished sends nothing; check Published when it's ready to go live."
  - "Both emails go out only once per story, so unpublishing and republishing won't send them again."
