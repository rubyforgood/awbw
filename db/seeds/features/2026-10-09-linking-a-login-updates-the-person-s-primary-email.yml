name: "Linking a login updates the person's primary email"
area: people
display_status: admin_facing
released_on: 2026-10-09
pr_number: 2633
summary: >-
  When a login is linked to a person, or a linked login's email changes, the
  person's primary email now becomes the login email. The address it replaces is
  kept as the secondary email, so registrations still recognize the person by it.
pro_tips:
  - "If the secondary email already holds a different address, the replaced one is saved as a comment on the person instead."
