name: "Fold leftover Leader affiliations into Facilitator"
area: people
display_status: admin_facing
released_on: 2026-10-24
pr_number: 2788
summary: >-
  Data health lists affiliations still titled Leader, which don't count toward
  program status, and one click folds them into Facilitator affiliations marked
  as primary contact.
pro_tips:
  - "A Leader row with a Facilitator row for the same dates merges into it, so no duplicate is left behind."
  - "A Leader row whose dates overlap a Facilitator row's but don't match stays listed for you to settle by hand."
  - "Each folded affiliation gets a comment saying it was a Leader."
action_path: "/admin/data_health"
