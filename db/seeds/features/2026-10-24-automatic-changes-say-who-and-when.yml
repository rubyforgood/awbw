name: "Automatic changes show who made them and when"
area: reporting
display_status: admin_facing
released_on: 2026-10-24
pr_number: 2834
summary: >-
  When the portal changes a record on its own — an organization's status after its last
  facilitator leaves, a Story Share menu edit, the address cleanup — the record's "last
  updated" now shows who triggered it and when, matching its entry in Activities.
